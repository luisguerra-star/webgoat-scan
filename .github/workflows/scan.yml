name: Dependency Check
on: workflow_dispatch
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Download WebGoat JAR
        run: |
          mkdir SCAN
          curl -L -o SCAN/webgoat-2026.4.jar https://github.com/WebGoat/WebGoat/releases/download/v2026.4/webgoat-2026.4.jar
      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: WebGoat
          path: SCAN
          format: HTML
          out: reports
          args: --nvdApiKey ${{ secrets.NVD_API_KEY }}
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports
